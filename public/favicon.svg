<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Oil barrel</title>
  <!-- body -->
  <path d="M14 10c0-2.2 8-4 18-4s18 1.8 18 4v44c0 2.2-8 4-18 4s-18-1.8-18-4z" fill="#d32f2f"/>
  <!-- left-side shading for depth -->
  <path d="M14 10c0-2.2 8-4 18-4v52c-10 0-18-1.8-18-4z" fill="#b71c1c" opacity=".55"/>
  <!-- rolling hoops -->
  <path d="M14 23c0 2.2 8 4 18 4s18-1.8 18-4" fill="none" stroke="#7f1010" stroke-width="2.6"/>
  <path d="M14 41c0 2.2 8 4 18 4s18-1.8 18-4" fill="none" stroke="#7f1010" stroke-width="2.6"/>
  <!-- top lid -->
  <ellipse cx="32" cy="10" rx="18" ry="4" fill="#ef5350"/>
  <ellipse cx="32" cy="10" rx="18" ry="4" fill="none" stroke="#7f1010" stroke-width="1.6"/>
  <!-- bung -->
  <ellipse cx="40" cy="9.6" rx="2.6" ry="1" fill="#7f1010"/>
  <!-- highlight -->
  <path d="M42 14v36" stroke="#ff8a80" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
</svg>
