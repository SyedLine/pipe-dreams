<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pd-icon.svg" />
    <link rel="apple-touch-icon" href="/pd-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Where should a WCS barrel at Hardisty go this month, and what is it worth?" />
    <title>Pipe Dreams — Hardisty egress netbacks</title>
    <script>
      // Dark by default; apply a saved light choice before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('pd-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
